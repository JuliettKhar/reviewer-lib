name: 'reviewer-lib code review'
description: 'AI code review for pull requests — posts inline comments + a summary using reviewer-lib.'
author: 'Julia Kharlamova'
branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  openai-api-key:
    description: 'OpenAI API key.'
    required: true
  github-token:
    description: 'Token used to read the PR diff and post comments.'
    required: false
    default: ${{ github.token }}
  pr-number:
    description: 'Pull request number. Defaults to the PR from the triggering event.'
    required: false
    default: ''
  fail-on:
    description: 'Fail the job when a finding is at or above this severity (critical|high|medium|low). Empty = never fail.'
    required: false
    default: ''
  model:
    description: 'Model to use for the review. Default is a reasoning model (o4-mini) for the fewest false positives; pass e.g. gpt-4o-mini for a cheaper, noisier review.'
    required: false
    default: 'o4-mini'
  version:
    description: 'reviewer-lib version to run (npm dist-tag or version). Must be >= 3.2.0 (the CLI).'
    required: false
    default: 'latest'
  exclude:
    description: 'Extra comma-separated path globs to skip (lockfiles + dist/ are skipped by default).'
    required: false
    default: ''
  summary:
    description: 'Add a short "what changed" overview above the findings (one extra model call). Set to "true" to enable.'
    required: false
    default: 'false'
  app-id:
    description: 'GitHub App ID. Set this together with app-private-key to post comments as your own App (custom bot name + avatar) instead of github-actions[bot]. Leave empty to use github-token.'
    required: false
    default: ''
  app-private-key:
    description: 'GitHub App private key (PEM contents). Pair with app-id. Store it as a secret.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Optional: mint an installation token for a GitHub App so comments are posted under the
    # App's identity (custom name + avatar). Skipped unless both app-id and app-private-key are set.
    - name: Generate GitHub App token
      id: app-token
      if: ${{ inputs.app-id != '' && inputs.app-private-key != '' }}
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    - name: Run reviewer-lib
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        # Prefer the App token when present; otherwise fall back to the github-token input.
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token || inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        PR="${{ inputs.pr-number }}"
        if [ -z "$PR" ]; then PR="${{ github.event.pull_request.number }}"; fi
        if [ -z "$PR" ]; then
          echo "::error::No PR number available — set the 'pr-number' input or run on a pull_request event."
          exit 1
        fi
        ARGS=(review --pr "$PR" --post --model "${{ inputs.model }}")
        if [ -n "${{ inputs.fail-on }}" ]; then ARGS+=(--fail-on "${{ inputs.fail-on }}"); fi
        if [ -n "${{ inputs.exclude }}" ]; then ARGS+=(--exclude "${{ inputs.exclude }}"); fi
        if [ "${{ inputs.summary }}" = "true" ]; then ARGS+=(--summary); fi
        npx --yes "reviewer-lib@${{ inputs.version }}" "${ARGS[@]}"
